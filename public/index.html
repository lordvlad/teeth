<style>
  :root { --navy:#1b2a6b; --tooth:#ffffff; --tooth-edge:#b9c8ff; --done:#6bdc7e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; }
  body { background:
           radial-gradient(circle at 12% 15%,#fff8 0 6%,transparent 6.5%),
           radial-gradient(circle at 88% 82%,#fff6 0 9%,transparent 9.5%),
           radial-gradient(circle at 85% 12%,#fff5 0 4%,transparent 4.5%),
           linear-gradient(160deg,#7be0ff,#b6a6ff 55%,#ffb3e6);
         color:var(--navy);
         font-family:"Baloo 2","Fredoka","Chalkboard SE","Comic Sans MS","Marker Felt",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
         padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom); user-select:none; }
  #wrap { position:relative; width:min(100vw - 16px, 100dvh - 250px, 680px); aspect-ratio:1; }
  svg { width:100%; height:100%; display:block; overflow:visible; }
  #disc { fill:#fff; opacity:.85; }
  #track { fill:none; stroke:#fff; stroke-opacity:.55; stroke-width:18; }
  #ring { fill:none; stroke:#ff6b6b; stroke-width:18; stroke-linecap:round;
          transform:rotate(-90deg); transform-origin:200px 200px; transition:stroke .4s; }
  .tooth { fill:#fffdf4; stroke:#d6cfb4; stroke-width:9; stroke-linejoin:round; transition:fill .3s; }
  .tooth.done { fill:#e3f6e7; stroke:#b7dcc0; }
  .tooth.active { fill:var(--c); stroke:var(--navy); stroke-width:12; filter:drop-shadow(0 0 22px var(--c));
                  animation:bounce .6s ease-in-out infinite alternate; transform-origin:0 0; }
  @keyframes bounce { from { scale:1 } to { scale:1.1 } }
  #time { font-size:clamp(34px,9vmin,64px); line-height:1; font-weight:900; color:#fff; -webkit-text-stroke:.16em var(--navy); paint-order:stroke fill;
          font-variant-numeric:tabular-nums; text-align:center; margin-bottom:2px; }
  #main svg { width:1.35em; height:1.35em; flex:none; fill:#fff; stroke:var(--navy); stroke-width:2.4; stroke-linejoin:round; }
  #main { min-width:0; padding:.3em .9em; font-size:clamp(18px,5vmin,30px); }
  #reset.icon { min-width:0; width:1.9em; height:1.9em; padding:0; font-size:clamp(20px,6vmin,34px); }
  #reset svg { width:1.1em; height:1.1em; fill:none; stroke:#fff; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
  #opts svg { width:1.3em; height:1.3em; flex:none; fill:#fff; stroke:var(--navy); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #opts label { display:flex; align-items:center; gap:6px; }
  #confetti svg { width:34px; height:34px; stroke:var(--navy); stroke-width:2.2; stroke-linejoin:round; }
  #btns { display:flex; flex-direction:row; gap:14px; align-items:center; justify-content:center; min-height:76px; margin-top:-5px; font-size:clamp(18px,5vmin,30px); }
  button { font:inherit; font-weight:900; color:#fff; background:#2fc65a; border:4px solid var(--navy); border-radius:999px;
           padding:.35em 1em; font-size:clamp(20px,6.5vmin,40px); min-width:4.6em; cursor:pointer;
           box-shadow:0 6px 0 var(--navy); display:flex; gap:.35em; align-items:center; justify-content:center; }
  button:active { transform:translateY(5px); box-shadow:0 1px 0 var(--navy); }
  button.pause { background:#ff9f1c; }
  button.alt { background:#4dabf7; font-size:clamp(16px,4.6vmin,28px); }
  [hidden] { display:none !important; }
  #opts { font-size:20px; font-weight:800; display:flex; gap:10px; align-items:center; min-height:2.2em; }
  select { font:inherit; font-weight:800; color:var(--navy); border-radius:14px; border:3px solid var(--navy); padding:.15em .5em; background:#fff; }
  #confetti { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  #confetti span { position:absolute; top:-10%; font-size:32px; animation:fall 3s linear forwards; }
  @keyframes fall { to { transform:translateY(120vh) rotate(540deg); } }
  #apk-dl { position:fixed; left:max(12px,env(safe-area-inset-left)); bottom:max(12px,env(safe-area-inset-bottom)); z-index:5; display:none;
            align-items:center; justify-content:center; width:56px; height:56px; padding:10px; border-radius:50%;
            background:#fff; border:4px solid var(--navy); box-shadow:0 4px 0 var(--navy); cursor:pointer; }
  #apk-dl svg { width:100%; height:100%; }
  #apk-dl:active { transform:translateY(3px); box-shadow:0 1px 0 var(--navy); }
  .is-app #apk-dl { display:none !important; }
  body.busy #heartBtn { display:none; }
  #heartBtn { position:fixed; right:max(12px,env(safe-area-inset-right)); bottom:max(12px,env(safe-area-inset-bottom)); z-index:5;
              width:56px; height:56px; min-width:0; padding:9px; border-radius:50%; border:4px solid var(--navy); background:#ffc9de;
              box-shadow:0 4px 0 var(--navy); }
  #heartBtn:active { transform:translateY(3px); box-shadow:0 1px 0 var(--navy); }
  #heartBtn svg, #closeDonate svg { width:100%; height:100%; }
  #donate { position:fixed; inset:0; z-index:12; background:#1b2a6bcc; display:flex; align-items:center; justify-content:center; padding:16px; }
  #donate .card { position:relative; width:min(420px,100%); max-height:100%; overflow:auto; background:#fff; border:5px solid var(--navy);
                  border-radius:30px; padding:22px 22px 14px; box-shadow:0 8px 0 var(--navy); color:var(--navy); text-align:center;
                  user-select:text; -webkit-user-select:text; }
  #donate .card * { user-select:text; -webkit-user-select:text; }
  #donate .cup { display:block; width:72px; height:72px; margin:0 auto 4px; }
  #donateNote { margin:8px 0; font-weight:700; }
  #gate p { margin:6px 0 12px; font-size:16px; font-weight:700; }
  #gateQ { font-size:34px; font-weight:900; margin:4px 0 12px; }
  #gate .row { display:flex; gap:10px; justify-content:center; }
  #gateA { width:120px; font:inherit; font-size:28px; font-weight:800; text-align:center; color:var(--navy); border:4px solid var(--navy); border-radius:16px; padding:6px; }
  #gate button[type=submit] { min-width:0; font-size:22px; padding:0 20px; border-radius:16px; border-width:4px; box-shadow:0 4px 0 var(--navy); }
  #gate.wrong #gateA { border-color:#e03131; animation:shake .35s; }
  @keyframes shake { 25% { transform:translateX(-8px) } 75% { transform:translateX(8px) } }
  #closeDonate { position:absolute; top:10px; right:10px; width:48px; height:48px; min-width:0; padding:7px; border-radius:50%;
                 border:4px solid var(--navy); background:#fff; box-shadow:none; }

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const isApp = Boolean(window.AndroidBridge || /TeethApp/i.test(navigator.userAgent) || window.location.protocol === "file:");
  if (isApp) { document.documentElement.classList.add("is-app"); }
  // Phases clockwise from top right; last is the front teeth.
  const PHASES = [
    { key: "TR", c: "#ff5d73" },
    { key: "BR", c: "#ff9f1c" },
    { key: "BL", c: "#22b8cf" },
    { key: "TL", c: "#9b5de5" },
    { key: "F",  c: "#f15bb5" },
  ];
  // Teeth sit on two horseshoe arches in the mouth's 911 x 1297 space (upper: front at the top; lower: front at the bottom).
  // Per side, from the front outward: central incisor, lateral incisor (front block), then canine, premolar, molar.
  const SIZES = [[125, 150], [100, 135], [105, 135], [120, 115], [170, 125]]; // [width along the arch, radial height]
  const ARCH = { U: { cy: 555, a: 335, b: 360, up: -1, k: 1 }, L: { cy: 780, a: 335, b: 335, up: 1, k: .92 } };
  const CX = 455, PX_PER_DEG = 6, GUM_END = 104;
  const groups = {}; PHASES.forEach(p => groups[p.key] = []);
  const teethG = $("teeth"), gumsG = $("gums");
  const mk = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  for (const jaw of ["U", "L"]) {
    const { cy, a, b, up, k } = ARCH[jaw];
    // Gum band along the whole arch, behind the teeth.
    let d = "";
    for (let deg = -GUM_END; deg <= GUM_END; deg += 4) {
      const th = deg * Math.PI / 180;
      d += `${d ? "L" : "M"}${(CX + a * Math.sin(th)).toFixed(1)} ${(cy + up * b * Math.cos(th)).toFixed(1)} `;
    }
    gumsG.appendChild(mk("path", { d, fill: "none", stroke: "#f6a79f", "stroke-width": 170, "stroke-linecap": "round", "stroke-linejoin": "round" }));
    for (const side of [-1, 1]) {
      let at = 0;
      SIZES.forEach(([w0, h0], i) => {
        const w = w0 * k, h = h0 * k, span = w / PX_PER_DEG;
        const th = side * (at + span / 2) * Math.PI / 180;
        at += span;
        const x = CX + a * Math.sin(th), y = cy + up * b * Math.cos(th);
        const rot = Math.atan2(b * Math.sin(th), a * Math.cos(th)) * 180 / Math.PI * -up;
        const gap = 5;
        const r = mk("rect", { class: "tooth", x: -(w - gap) / 2, y: -(h - gap) / 2, width: w - gap, height: h - gap, rx: Math.min(w, h) * .32 });
        const g = mk("g", { transform: `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)})` });
        g.appendChild(r);
        teethG.appendChild(g);
        const key = i < 2 ? "F" : side > 0 ? (jaw === "U" ? "TR" : "BR") : (jaw === "U" ? "TL" : "BL");
        groups[key].push(r);
      });
    }
  }

  const ICON = {
    play: '<path d="M7 4.5v15l13-7.5z"/>',
    pause: '<rect x="5.5" y="4.5" width="5" height="15" rx="1.5"/><rect x="13.5" y="4.5" width="5" height="15" rx="1.5"/>',
  };
  const CONFETTI = [
    '<svg viewBox="0 0 24 24" fill="#ffd43b"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.7-5.9-3.4-5.9 3.4 1.3-6.7L2.5 9.5l6.6-.8z"/></svg>',
    '<svg viewBox="0 0 48 48" fill="#ff4d8d"><path d="M24 41C10 31 4 24 4 16 4 9 9 5 15 5c4 0 7 2 9 6 2-4 5-6 9-6 6 0 11 4 11 11 0 8-6 15-20 25z"/></svg>',
    '<svg viewBox="0 0 24 24" fill="#fff"><path d="M5 8c0-3.5 3-5 5.5-4 1 .4 2.5.4 3 0 2.5-1 5.500.5 5.500 4 0 3.500-1.500 5-2 8-.3 2-2 2.500-2.500.3-.3-1.300-.7-2.300-1.500-2.300s-1.200 1-1.500 2.300c-.5 2.200-2.200 1.700-2.500-.3-.5-3-2-4.500-2-8z"/></svg>',
    '<svg viewBox="0 0 24 24" fill="#4dabf7"><circle cx="12" cy="12" r="8"/></svg>',
    '<svg viewBox="0 0 24 24" fill="#69db7c"><path d="M12 3l3.500 9-3.500 9-3.500-9z"/></svg>',
    '<svg viewBox="0 0 24 24" fill="#ff9f1c"><ellipse cx="12" cy="10" rx="6.500" ry="7.500"/><path d="M12 17.500v4"/></svg>',
  ];
  const ring = $("ring"), timeEl = $("time");
  const mainBtn = $("main"), resetBtn = $("reset"), durSel = $("dur"), opts = $("opts");

  let state = "idle";            // idle | running | paused | done
  let total = +durSel.value * 1000;
  let elapsed = 0, startedAt = 0, raf = 0, lastIdx = -1, audio = null, wakeLock = null;

  const fmt = ms => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

  function chime(final) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const notes = final ? [523, 659, 784, 1047] : [784, 988];
      notes.forEach((f, k) => {
        const o = audio.createOscillator(), g = audio.createGain(), t0 = audio.currentTime + k * 0.14;
        o.type = "sine"; o.frequency.value = f; o.connect(g); g.connect(audio.destination);
        g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
        o.start(t0); o.stop(t0 + 0.4);
      });
    } catch (e) {}
    if (window.AndroidBridge && window.AndroidBridge.vibrate) { window.AndroidBridge.vibrate(final ? 400 : 150); }
    else if (navigator.vibrate) navigator.vibrate(final ? [200, 100, 200, 100, 400] : 150);
  }

  // Keep screen awake: Screen Wake Lock API (secure contexts), else a hidden looping video (works on plain http / older iOS).
  const VIDEO = { webm: "data:video/webm;base64,GkXfo59ChoEBQveBAULygQRC84EIQoKEd2VibUKHgQJChYECGFOAZwEAAAAAAAHmEU2bdLpNu4tTq4QVSalmU6yBoU27i1OrhBZUrmtTrIHWTbuMU6uEElTDZ1OsggEjTbuMU6uEHFO7a1OsggHQ7AEAAAAAAABZAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAVSalmsCrXsYMPQkBNgIxMYXZmNjIuMy4xMDBXQYxMYXZmNjIuMy4xMDBEiYhAj0AAAAAAABZUrmvIrgEAAAAAAAA/14EBc8WI33EWIWEWfF6cgQAitZyDdW5kiIEAhoVWX1ZQOIOBASPjg4Q7msoA4JCwgRC6gRCagQJVsIRVuYEBElTDZ/tzc59jwIBnyJlFo4dFTkNPREVSRIeMTGF2ZjYyLjMuMTAwc3PWY8CLY8WI33EWIWEWfF5nyKFFo4dFTkNPREVSRIeUTGF2YzYyLjExLjEwMCBsaWJ2cHhnyKFFo4hEVVJBVElPTkSHkzAwOjAwOjAxLjAwMDAwMDAwMAAfQ7Z1qOeBAKOjgQAAgBACAJ0BKhAAEAAARwiFhYiZhIgCAgAMDWAA/v+rUIAcU7trkbuPs4EAt4r3gQHxggGj8IED", mp4: "data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAMUbW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAAA+gAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAj90cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAAA+gAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAABAAAAAQAAAAAAAkZWR0cwAAABxlbHN0AAAAAAAAAAEAAAPoAAAAAAABAAAAAAG3bWRpYQAAACBtZGhkAAAAAAAAAAAAAAAAAABAAAAAQABVxAAAAAAALWhkbHIAAAAAAAAAAHZpZGUAAAAAAAAAAAAAAABWaWRlb0hhbmRsZXIAAAABYm1pbmYAAAAUdm1oZAAAAAEAAAAAAAAAAAAAACRkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAx1cmwgAAAAAQAAASJzdGJsAAAAvnN0c2QAAAAAAAAAAQAAAK5hdmMxAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAABAAEABIAAAASAAAAAAAAAABFUxhdmM2Mi4xMS4xMDAgbGlieDI2NAAAAAAAAAAAAAAAGP//AAAANGF2Y0MBZAAK/+EAF2dkAAqs2V7ARAAAAwAEAAADAAg8SJZYAQAGaOvjyyLA/fj4AAAAABBwYXNwAAAAAQAAAAEAAAAUYnRydAAAAAAAABW4AAAAAAAAABhzdHRzAAAAAAAAAAEAAAABAABAAAAAABxzdHNjAAAAAAAAAAEAAAABAAAAAQAAAAEAAAAUc3RzegAAAAAAAAK3AAAAAQAAABRzdGNvAAAAAAAAAAEAAANEAAAAYXVkdGEAAABZbWV0YQAAAAAAAAAhaGRscgAAAAAAAAAAbWRpcmFwcGwAAAAAAAAAAAAAAAAsaWxzdAAAACSpdG9vAAAAHGRhdGEAAAABAAAAAExhdmY2Mi4zLjEwMAAAAAhmcmVlAAACv21kYXQAAAKfBgX//5vcRem95tlIt5Ys2CDZI+7veDI2NCAtIGNvcmUgMTY1IC0gSC4yNjQvTVBFRy00IEFWQyBjb2RlYyAtIENvc   let vid = null, wantAwake = false;
  function setAndroidScreenAwake(keepOn) {
    try {
      if (window.AndroidBridge && window.AndroidBridge.setKeepScreenOn) {
        window.AndroidBridge.setKeepScreenOn(keepOn);
      }
    } catch (e) {}
  }

  async function lock() {
    wantAwake = true;
    setAndroidScreenAwake(true);
    try {
      if ("wakeLock" in navigator) {
        if (!wakeLock) {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeLock.addEventListener("release", () => {
            wakeLock = null;
            if (wantAwake && !document.hidden) lock();
          });
        }
        return;
      }
    } catch (e) {}
    if (!vid) {
      vid = document.createElement("video");
      vid.setAttribute("playsinline", ""); vid.muted = true; vid.loop = true;
      vid.style.cssText = "position:fixed;width:1px;height:1px;opacity:.01;pointer-events:none;left:0;top:0";
      const src = vid.canPlayType("video/webm") ? VIDEO.webm : VIDEO.mp4;
      vid.src = src; document.body.appendChild(vid);
    }
    vid.play().catch(() => {});
  }
  function unlock() {
    wantAwake = false;
    setAndroidScreenAwake(false);
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
    if (vid) vid.pause();
  }

  function paintTeeth(idx) {
    PHASES.forEach((p, k) => groups[p.key].forEach(el => {
      el.style.setProperty("--c", p.c);
      el.classList.toggle("active", state !== "idle" && state !== "done" && k === idx);
      el.classList.toggle("done", state === "done" || (state !== "idle" && k < idx));
    }));
  }

  function render() {
    const phaseLen = total / PHASES.length;
    const idx = Math.min(PHASES.length - 1, Math.floor(elapsed / phaseLen));
    const p = state === "done" ? 1 : state === "idle" ? 0 : (elapsed - idx * phaseLen) / phaseLen;
    // Remaining arc runs CW from the top; its far end retracts, so the erased part grows CCW from the top.
    ring.setAttribute("stroke-dasharray", `${Math.max(0, 1 - p)} 1`);
    ring.style.opacity = p >= 1 ? 0 : 1;
    ring.style.stroke = PHASES[idx].c;
    timeEl.textContent = fmt(Math.max(0, total - elapsed));
    if (state === "running" && lastIdx >= 0 && idx > lastIdx) chime(false);
    if (idx !== lastIdx) { lastIdx = idx; paintTeeth(idx); }
  }

  function ui() {
    mainBtn.hidden = state === "done";
    resetBtn.hidden = !(state === "paused" || state === "done");
    $("mi").innerHTML = state === "running" ? ICON.pause : ICON.play;
    mainBtn.setAttribute("aria-label", state === "idle" ? "Start" : state === "running" ? "Pause" : "Weiter");
    mainBtn.classList.toggle("pause", state === "running");
    opts.style.visibility = state === "idle" ? "visible" : "hidden";
    document.body.classList.toggle("busy", state !== "idle");
    const apkDl = $("apk-dl");
    if (apkDl) {
      apkDl.style.display = (!isApp && state === "idle") ? "flex" : "none";
    }
  }

  function tick() {
    elapsed = Math.min(total, performance.now() - startedAt);
    if (elapsed >= total) { finish(); return; }
    if (state === "running") setAndroidScreenAwake(true);
    render();
    raf = requestAnimationFrame(tick);
  }

  function begin() {
    state = "running"; startedAt = performance.now() - elapsed;
    audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume && audio.resume();
    lock(); lastIdx = -1; ui(); cancelAnimationFrame(raf); tick();
  }
  function finish() {
    cancelAnimationFrame(raf); state = "done"; elapsed = total; lastIdx = -1; unlock(); chime(true); render(); ui(); party();
  }
  function party() {
    const box = $("confetti"); box.textContent = "";
    for (let i = 0; i < 30; i++) {
      const e = document.createElement("span");
      e.innerHTML = CONFETTI[i % CONFETTI.length];
      e.style.left = Math.random() * 100 + "%"; e.style.animationDelay = Math.random() * 1.5 + "s";
      box.appendChild(e);
    }
    setTimeout(() => box.textContent = "", 5000);
  }
  function pause() { cancelAnimationFrame(raf); state = "paused"; lastIdx = -1; render(); ui(); }
  function reset() {
    $("confetti").textContent = "";
    cancelAnimationFrame(raf); state = "idle"; elapsed = 0; total = +durSel.value * 1000; lastIdx = -1; unlock(); render(); ui();
  }

  mainBtn.onclick = () => { state === "idle" || state === "paused" ? begin() : pause(); };
  resetBtn.onclick = reset;
  durSel.onchange = reset;
  document.addEventListener("visibilitychange", () => { if (wantAwake && !document.hidden) lock(); });
  window.addEventListener("focus", () => { if (wantAwake) lock(); });

  reset();

  // Donate: PayPal hosted button, loaded only after a parent gate so the app stays offline-first.
  const PAYPAL_SDK = "https://www.paypal.com/sdk/js?client-id=BAA3I7Ebq_jrRrnlIQTorf96Vylh95OQRNrqVHNIKrAZwR_W_TSGVwxmFpKQHdeP5y6_VcXKmOZ57oqBc8&components=hosted-buttons&disable-funding=venmo&currency=EUR";
  const PAYPAL_PAGE = "https://www.paypal.com/ncp/payment/7TRVZVKH42ZM6";
  let paypalState = "idle";   // idle | loading | ready
  const donateNote = text => { $("donateNote").textContent = text; $("donateNote").hidden = !text; };
  function loadPaypal() {
    if (paypalState !== "idle") return;
    if (!navigator.onLine) return donateNote("Du bist offline. Verbinde dich mit dem Internet, um zu spenden.");
    paypalState = "loading"; donateNote("Lädt…");
    const fail = () => { paypalState = "idle"; donateNote("PayPal konnte nicht geladen werden. Bitte später erneut versuchen."); };
    const s = document.createElement("script");
    s.src = PAYPAL_SDK;
    s.onload = () => {
      paypal.HostedButtons({ hostedButtonId: "7TRVZVKH42ZM6" }).render("#paypal-container-7TRVZVKH42ZM6")
        .then(() => { paypalState = "ready"; donateNote(""); }).catch(fail);
    };
    s.onerror = () => { s.remove(); fail(); };
    document.head.append(s);
  }
  let gateAnswer = 0;
  function newQuestion() {
    const a = 3 + Math.floor(Math.random() * 7), b = 6 + Math.floor(Math.random() * 4);
    gateAnswer = a * b;
    $("gateQ").textContent = `${a} × ${b} = ?`;
    $("gateA").value = "";
  }
  function openDonate() {
    newQuestion();
    $("gate").hidden = false; $("pay").hidden = true; $("gate").classList.remove("wrong");
    $("donate").hidden = false;
    $("gateA").focus();
  }
  const closeDonate = () => { $("gateA").blur(); $("donate").hidden = true; };
  $("gate").addEventListener("submit", e => {
    e.preventDefault();
    const v = $("gateA").value.trim();
    if (v !== "" && Number(v) === gateAnswer) {
      $("gateA").blur();
      if (isApp && window.AndroidBridge && window.AndroidBridge.openUrl) {
        // The WebView can't render the PayPal SDK button; open PayPal's hosted page in the system browser instead.
        closeDonate();
        window.AndroidBridge.openUrl(PAYPAL_PAGE);
        return;
      }
      $("gate").hidden = true; $("pay").hidden = false;
      loadPaypal();
    } else {
      $("gate").classList.remove("wrong"); void $("gate").offsetWidth; $("gate").classList.add("wrong");
      newQuestion();
    }
  });
  $("heartBtn").addEventListener("click", openDonate);
  $("closeDonate").addEventListener("click", closeDonate);
  $("donate").addEventListener("click", e => { if (e.target.id === "donate") closeDonate(); });
  // Heart: in the APK always (opens PayPal in the system browser); in a browser only on the real deployment (HTTPS or service worker).
  const showHeart = () => { $("heartBtn").hidden = !(isApp || location.protocol === "https:" || navigator.serviceWorker?.controller); };
  navigator.serviceWorker?.addEventListener("controllerchange", showHeart);
  showHeart();

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
